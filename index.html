<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LocksMitch">
<meta name="robots" content="noindex, nofollow">
<title>LocksMitch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=6">
</head>
<body>
<header class="top">
  <button class="iconbtn" id="back" aria-label="Back" hidden>&#8249;</button>
  <h1 id="title">LocksMitch</h1>
  <span class="badge off" id="offline" hidden>offline</span>
  <button class="iconbtn" id="refresh" aria-label="Refresh">&#8635;</button>
</header>

<main id="main">
  <section data-view="login" hidden>
    <img src="assets/logo.webp" alt="LocksMitch" class="logo">
    <p>Send <b>/app</b> to the bot in Telegram and enter the 6-digit code.</p>
    <form id="loginForm">
      <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="one-time-code" required>
      <button type="submit" class="primary">Sign in</button>
    </form>
    <p class="err" id="loginErr" hidden></p>
  </section>

  <section data-view="leads" hidden>
    <nav class="tabs" id="tabs">
      <button data-filter="open" class="on">Open</button>
      <button data-filter="today">Today</button>
      <button data-filter="done">Done</button>
    </nav>
    <ul class="list" id="leadList"></ul>
    <p class="muted" id="leadsEmpty" hidden>Nothing here.</p>
  </section>

  <section data-view="lead" hidden>
    <div id="leadCard"></div>
    <div id="leadActions"></div>
    <div id="sheet" class="sheet" hidden></div>
  </section>

  <section data-view="invoice" hidden>
    <div id="invoiceBox"></div>
  </section>

  <section data-view="money" hidden>
    <div id="moneyBox"></div>
  </section>
</main>

<nav class="bottom" id="nav">
  <button data-go="leads" class="on"><span class="ico">&#9776;</span>Leads</button>
  <button data-go="money"><span class="ico">$</span>Money</button>
</nav>
<div id="toast" class="toast" hidden></div>

<script src="core.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
